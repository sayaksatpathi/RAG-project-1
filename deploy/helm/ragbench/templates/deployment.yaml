apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ragbench.fullname" . }}
  labels:
    {{- include "ragbench.labels" . | nindent 4 }}
spec:
  # Single replica with SQLite (ReadWriteOnce). Scale out only with Postgres.
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ragbench.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ragbench.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "ragbench.fullname" . }}-config
            - secretRef:
                name: {{ include "ragbench.secretName" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ragbench.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
