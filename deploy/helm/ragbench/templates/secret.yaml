{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ragbench.secretName" . }}
  labels:
    {{- include "ragbench.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Provide a token at install time: --set apiToken=... ; empty falls back to the
  # app's development default, which must NOT be used in a real deployment.
  RAGBENCH_API_TOKEN: {{ .Values.apiToken | default "dev-local-token" | quote }}
{{- end }}
