apiVersion: v1
kind: Service
metadata:
  name: {{ include "ragbench.fullname" . }}
  labels:
    {{- include "ragbench.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ragbench.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8000
