apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragbench-api
  labels:
    app: ragbench
spec:
  # Single replica by design: the default SQLite backend uses a ReadWriteOnce
  # volume that cannot be shared across pods. Horizontal scaling requires the
  # Postgres backend (RAGBENCH_STORAGE=postgres); do NOT raise replicas here with
  # SQLite. This is not an auto-scaling / HA claim.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ragbench
  template:
    metadata:
      labels:
        app: ragbench
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ragbench:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ragbench-config
            - secretRef:
                name: ragbench-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ragbench-data
