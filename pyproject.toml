[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbench"
version = "0.1.0"
description = "Adaptive Retrieval-Augmented Generation platform and evaluation harness"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.27",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Heavy / optional capabilities. The core offline path does NOT require these.
ml = ["sentence-transformers>=2.5", "scikit-learn>=1.4"]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
ragbench = "ragbench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ragbench*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
